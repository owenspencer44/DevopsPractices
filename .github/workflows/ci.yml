name: CI

# Runs every time something is pushed to main
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Syntax check + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Start mylinux container
        run: docker run -d --name mylinux --hostname mylinux -v "$PWD":/work -w /work ubuntu:24.04 sleep infinity

      - name: Run pipeline.yml
        run: ./run-pipeline.sh
