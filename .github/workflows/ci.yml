name: CI

# Runs every time something is pushed to the dev branch
on:
  push:
    branches: [dev]

# Lets the workflow push to main when the checks pass
permissions:
  contents: write

jobs:
  checks:
    name: Syntax check + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Start mylinux container
        run: docker run -d --name mylinux --hostname mylinux -v "$PWD":/work -w /work ubuntu:24.04 sleep infinity

      - name: Run pipeline.yml
        run: ./run-pipeline.sh

  merge-to-main:
    name: Merge dev into main
    needs: checks   # only runs if every check passed
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main to the tested commit
        run: |
          git merge --ff-only ${{ github.sha }}
          git push origin main
